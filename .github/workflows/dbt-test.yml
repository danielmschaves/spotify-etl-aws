name: dbt Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-test.yml'
  push:
    branches:
      - main
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-test.yml'

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt and dependencies
        run: |
          pip install dbt-core==1.8.0 dbt-duckdb==1.8.0 duckdb==1.0.0
      
      - name: Install dbt packages
        working-directory: ./dbt/spotify_etl_aws
        run: dbt deps
      
      - name: Run dbt compile
        working-directory: ./dbt/spotify_etl_aws
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dbt compile --profiles-dir .
      
      - name: Run dbt parse
        working-directory: ./dbt/spotify_etl_aws
        run: dbt parse --profiles-dir .
      
      - name: Run dbt debug
        working-directory: ./dbt/spotify_etl_aws
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dbt debug --profiles-dir . || true

