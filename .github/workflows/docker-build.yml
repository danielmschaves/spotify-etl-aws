name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-images:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        image:
          - airflow
          - ingestion
          - dbt
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ${{ matrix.image }} image
        if: matrix.image != 'airflow'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: spotify-etl-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Airflow image
        if: matrix.image == 'airflow'
        uses: docker/build-push-action@v5
        with:
          context: ./airflow
          file: ./airflow/Dockerfile
          push: false
          tags: spotify-etl-airflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

